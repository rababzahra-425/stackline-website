name: Stackline Website CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # CI - Test and Build Validation
  # ==========================================
  ci:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 4. Build frontend (Code validation)
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      # 5. Install backend dependencies
      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      # 6. Run automated tests
      - name: Run backend tests
        working-directory: server
        env:
          NODE_ENV: test
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: npm test

  # ==========================================
  # CD - Auto Deploy to Contabo VPS
  # ==========================================
  deploy:
    name: Deploy to Contabo VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            password: ${{ secrets.VPS_PASSWORD }}
            port: ${{ secrets.VPS_PORT }}
            script_stop: true
            script: |
              export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
              [ -s "$HOME/.nvm/nvm.sh" ] && \. "$HOME/.nvm/nvm.sh"
              cd /opt/stackline-website
              git checkout main
              git pull origin main

              cd server
              npm ci --omit=dev
              pm2 reload stackline-backend --update-env
              cd ../frontend
              npm ci
              npm run build